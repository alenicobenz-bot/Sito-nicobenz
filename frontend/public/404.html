<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0B0B0C" />
    <title>Pagina non trovata — Nicobenz</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 20px;
        background: #0B0B0C;
        color: #EDE7D9;
        font-family: Georgia, "Times New Roman", serif;
        text-align: center;
      }
      main { max-width: 460px; }
      .mark { font-size: 28px; letter-spacing: 0.04em; margin: 0; }
      .mark span { color: #C9A96E; }
      h1 { font-weight: 400; font-size: 36px; margin: 28px 0 12px; }
      p { margin: 0; color: #C9C2B2; font-family: Inter, Helvetica, Arial, sans-serif; font-size: 16px; line-height: 1.5; }
      nav { margin-top: 28px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
      a {
        color: #0B0B0C;
        background: #C9A96E;
        text-decoration: none;
        padding: 12px 18px;
        font-family: Inter, Helvetica, Arial, sans-serif;
        font-size: 13px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      a.secondary { color: #EDE7D9; background: transparent; border: 1px solid rgba(237, 231, 217, 0.22); }
    </style>
  </head>
  <body>
    <main>
      <p class="mark">Nico<span>benz</span></p>
      <h1>Pagina non trovata</h1>
      <p>Questo indirizzo non esiste oppure è stato spostato.</p>
      <nav>
        <a href="/">Torna alla home</a>
        <a class="secondary" href="/blog">Vai al blog</a>
      </nav>
    </main>
  </body>
</html>
